name: Qazo Cloud Automation

on:
  schedule:
    # يشتغل البوت أوتوماتيكياً كل 36 ساعة أو في الأوقات المحددة (مثلاً أيام الإجازات والليل)
    - cron: '0 18 * * 4,5' # يعمل مساء الخميس والجمعة في ذروة الملل
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Qazo Bot
        run: python qazo_bot.py
